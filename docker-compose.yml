version: "3.8"

# Online Boutique — 本地全栈 Docker Compose
# 启动: docker compose up --build -d
# 前端: http://localhost:8080

services:

  # ── 自建镜像 ──────────────────────────────────────────────
  frontend:
    build: ./src/frontend
    image: online-boutique/frontend:local
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - CURRENCY_SERVICE_ADDR=currencyservice:7000
      - CART_SERVICE_ADDR=cartservice:7070
      - RECOMMENDATION_SERVICE_ADDR=recommendationservice:8080
      - CHECKOUT_SERVICE_ADDR=checkoutservice:5050
      - SHIPPING_SERVICE_ADDR=shippingservice:50051
      - AD_SERVICE_ADDR=adservice:9555
      - REWARD_SERVICE_ADDR=rewardservice:8080
      - SHOPPING_ASSISTANT_SERVICE_ADDR=shoppingassistantservice:80
      - ENABLE_TRACING=0
      - ENABLE_PROFILER=0
    depends_on:
      - productcatalogservice
      - currencyservice
      - cartservice
      - recommendationservice
      - checkoutservice
      - shippingservice
      - adservice
      - rewardservice
      - shoppingassistantservice
    restart: unless-stopped

  checkoutservice:
    build: ./src/checkoutservice
    image: online-boutique/checkoutservice:local
    environment:
      - PORT=5050
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - SHIPPING_SERVICE_ADDR=shippingservice:50051
      - PAYMENT_SERVICE_ADDR=paymentservice:50051
      - EMAIL_SERVICE_ADDR=emailservice:5000
      - CURRENCY_SERVICE_ADDR=currencyservice:7000
      - CART_SERVICE_ADDR=cartservice:7070
      - ENABLE_TRACING=0
      - REWARD_SERVICE_ADDR=rewardservice:8080
    depends_on:
      - productcatalogservice
      - shippingservice
      - paymentservice
      - emailservice
      - currencyservice
      - cartservice
    restart: unless-stopped

  rewardservice:
    build: ./src/rewardservice
    image: online-boutique/rewardservice:local
    environment:
      - PORT=8080
      - REDIS_ADDR=redis-reward:6379
    depends_on:
      - redis-reward
    restart: unless-stopped

  redis-reward:
    image: redis:alpine
    restart: unless-stopped

  # ── 上游预构建镜像 ──────────────────────────────────────────
  productcatalogservice:
    image: us-central1-docker.pkg.dev/google-samples/microservices-demo/productcatalogservice:v0.10.2
    environment:
      - PORT=3550
      - ENABLE_TRACING=0
    restart: unless-stopped

  currencyservice:
    image: us-central1-docker.pkg.dev/google-samples/microservices-demo/currencyservice:v0.10.2
    environment:
      - PORT=7000
      - ENABLE_TRACING=0
    restart: unless-stopped

  cartservice:
    image: us-central1-docker.pkg.dev/google-samples/microservices-demo/cartservice:v0.10.2
    environment:
      - REDIS_ADDR=redis-cart:6379
    depends_on:
      - redis-cart
    restart: unless-stopped

  redis-cart:
    image: redis:alpine
    restart: unless-stopped

  shippingservice:
    image: us-central1-docker.pkg.dev/google-samples/microservices-demo/shippingservice:v0.10.2
    environment:
      - PORT=50051
      - ENABLE_TRACING=0
    restart: unless-stopped

  paymentservice:
    image: us-central1-docker.pkg.dev/google-samples/microservices-demo/paymentservice:v0.10.2
    environment:
      - PORT=50051
      - ENABLE_TRACING=0
    restart: unless-stopped

  emailservice:
    image: us-central1-docker.pkg.dev/google-samples/microservices-demo/emailservice:v0.10.2
    environment:
      - PORT=5000
      - ENABLE_TRACING=0
    restart: unless-stopped

  recommendationservice:
    image: us-central1-docker.pkg.dev/google-samples/microservices-demo/recommendationservice:v0.10.2
    environment:
      - PORT=8080
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - ENABLE_TRACING=0
    depends_on:
      - productcatalogservice
    restart: unless-stopped

  adservice:
    image: us-central1-docker.pkg.dev/google-samples/microservices-demo/adservice:v0.10.2
    environment:
      - PORT=9555
      - ENABLE_TRACING=0
    restart: unless-stopped

  # Shopping assistant 简单存根（frontend 必须有此地址）
  shoppingassistantservice:
    image: nginx:alpine
    restart: unless-stopped
